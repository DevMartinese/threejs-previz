<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>previz inspector</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #17181a; color: #d8d8d8;
             font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr;
             grid-template-areas: "head" "stage" "foot"; height: 100vh; }
      #app.with-panel { grid-template-columns: 1fr 280px;
                        grid-template-areas: "head head" "stage params" "foot foot"; }
      header { grid-area: head; border-bottom: 1px solid #2e3033; }
      footer { grid-area: foot; border-top: 1px solid #2e3033; }
      header, footer { padding: 8px 12px; background: #202225; border-color: #2e3033;
                       display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

      #params { grid-area: params; background: #202225; border-left: 1px solid #2e3033;
                padding: 0 0 16px; overflow-y: auto; display: flex;
                flex-direction: column; gap: 10px; }
      #params > :not(.gui-host) { margin-left: 10px; margin-right: 10px; }
      /* lil-gui ships its own styles; these only make it fill the column, sit
         in the inspector's palette, and mark a controller whose value has left
         its declared default. Class names carry lil-gui 0.21's `lil-` prefix. */
      .gui-host .lil-root { width: 100%; --width: 100%; }
      .gui-host .lil-gui { --background-color: #202225; --title-background-color: #26282c;
                           --focus-color: #3f6c8e; --hover-color: #34373c;
                           --number-color: #7fd4ff; --string-color: #cfe6c4;
                           --text-color: #d8d8d8; --title-text-color: #e6e6e6;
                           --font-family: inherit; --font-size: 12px;
                           --input-font-size: 12px; --name-width: 46%; }
      .gui-host .dirty > .lil-name { color: #7fd4ff; font-weight: 600; }
      .note { margin: 2px 0 0; font-size: 11px; line-height: 1.35; }
      .hot { background: #3f6c8e; color: #fff; }
      .error { margin: 0; padding: 6px 8px; border-radius: 4px; font-size: 11px;
               background: #4a2326; border: 1px solid #7a3a3f; color: #f0c8c8; }
      code { background: #2b2d31; padding: 0 3px; border-radius: 3px; }
      .stage-error { max-width: 460px; padding: 18px 20px; border-radius: 6px;
                     background: #23252a; border: 1px solid #3a3d42; line-height: 1.5; }
      .stage-error p { margin: 8px 0 0; }
      .report, .error { margin: 0; padding: 6px 8px; border-radius: 4px; font-size: 11px;
                        white-space: pre-wrap; max-height: 220px; overflow: auto;
                        font-family: inherit; }
      .report { background: #23331f; border: 1px solid #3f5f36; color: #cfe6c4; }
      #stage { grid-area: stage; position: relative; overflow: hidden; display: grid;
               place-items: center; background: #101113; }
      canvas { display: block; }
      select, button { background: #2b2d31; color: #e6e6e6; border: 1px solid #3a3d42;
                       border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
      button.on { background: #3f6c8e; border-color: #4f86ad; }
      input[type=range] { flex: 1; min-width: 220px; accent-color: #3f6c8e; }
      .dim { color: #8a8d92; }
      .tag { padding: 1px 6px; border-radius: 3px; background: #2b2d31; }
      label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
